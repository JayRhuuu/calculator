<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive calculator app built with HTML, CSS, and JavaScript.">
    <meta name="theme-color" content="#2563eb">
    <title>Calculator</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <header>
            <h1>My Calculator</h1>
        </header>
        <input type="text" id="display" placeholder="0" aria-label="Calculator display" readonly>
        <div class="box">
            <div class="button-box">
                <button type="button" class="btn" id="c">C</button>
                <button type="button" class="btn" id="percentage">%</button>
                <button type="button" class="btn" id="clearOnce">←</button>
                <button type="button" class="btn" id="divide">/</button>

                <button type="button" class="btn" id="seven">7</button>
                <button type="button" class="btn" id="eight">8</button>
                <button type="button" class="btn" id="nine">9</button>
                <button type="button" class="btn" id="multiply">×</button>

                <button type="button" class="btn" id="four">4</button>
                <button type="button" class="btn" id="five">5</button>
                <button type="button" class="btn" id="six">6</button>
                <button type="button" class="btn" id="minus">-</button>

                <button type="button" class="btn" id="one">1</button>
                <button type="button" class="btn" id="two">2</button>
                <button type="button" class="btn" id="three">3</button>
                <button type="button" class="btn" id="plus">+</button>

                <button type="button" class="btn" id="doubleZero">00</button>
                <button type="button" class="btn" id="zero">0</button>
                <button type="button" class="btn" id="dot">.</button>
                <button type="button" class="btn" id="equal">=</button>
            </div>
        </div>
    </main>
    <script type="module" src="script.js"></script>
</body>

</html>
